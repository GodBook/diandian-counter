plugins { id 'com.android.application' }

def signingFile = rootProject.file('signing.properties')
def signingValues = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingValues.load(it) }

android {
    namespace 'cn.diandian.counter'
    compileSdk 36
    defaultConfig {
        applicationId 'cn.diandian.counter'
        minSdk 26
        targetSdk 36
        versionCode providers.gradleProperty('counterVersionCode').orElse('3').get().toInteger()
        versionName providers.gradleProperty('counterVersionName').orElse('1.1.1').get()
        testApplicationId 'cn.diandian.counter.tests'
        testInstrumentationRunner 'cn.diandian.counter.CounterTestRunner'
    }
    signingConfigs {
        if (signingFile.exists()) {
            release {
                storeFile rootProject.file(signingValues['storeFile'])
                storePassword signingValues['storePassword']
                keyAlias signingValues['keyAlias']
                keyPassword signingValues['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (signingFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.returnDefaultValues = true }
    testBuildType providers.gradleProperty('counterTestBuildType').orElse('debug').get()
    lint { abortOnError true }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
